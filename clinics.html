<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="wrap">

  <div class="mini-header">
    <a href="/"><img src="logo_small.jpg" alt="Bridgewater Bocce Club logo"></a>
    <div class="site-name">Bridgewater Bocce</div>
  </div>
  <div class="tab-strip">
    <a class="league-reg" href="/registration">League Registration</a>
    <a class="survey" href="/fall-survey">Fall Survey</a>
    <a class="teams" href="/teams">Teams</a>
    <a class="schedule" href="/schedule">Schedule</a>
    <a class="results" href="/results">Results &amp; Standings</a>
    <a class="clinics active" href="/clinics">Clinics &amp; Classes</a>

  </div>

  <div class="page-content">




    <h2 style="font-size:20px;font-weight:800;color:#1a3fa0;margin:0 0 12px;">Beginners Clinic</h2>
    <div style="font-size:15px;line-height:1.8;margin-bottom:22px;">
      <p>Content Coming Soon.</p>
    </div>

    <div class="home-link-row"><a href="/">HOME</a></div>
  </div>

</div>

<script>
document.querySelectorAll('form[data-netlify]').forEach(function(form){
                                                                  form.addEventListener('submit', function(e){
                                                                                             e.preventDefault();
                                                                                             var data = new URLSearchParams(new FormData(form)).toString();
                                                                                             fetch('/', { method: 'POST', headers: { 'Content-Type': 'application/x-www-form-urlencoded' }, body: data })
                                                                                               .then(function(){
                                                                                                                     form.style.display = 'none';
                                                                                                                     var ty = document.getElementById(form.getAttribute('data-thankyou'));
                                                                                                                     if (ty) ty.classList.add('show');
                                                                                                                   })
                                                                                               .catch(function(){
                                                                                                                      alert('There was a problem submitting the form. Please check your connection and try again.');
                                                                                                                    });
                                                                                           });
                                                                });
</script>


</body></html>
